<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모의고사 AI 단어장 (21~41번)</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI단어장">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f5f5f7; margin: 0; padding: 20px; color: #1d1d1f; }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #0071e3; }
    
    .input-group { margin-bottom: 16px; }
    label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 6px; }
    .key-wrapper { display: flex; gap: 8px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 10px; font-size: 0.95rem; }
    .btn-clear { width: 80px; background: #e5e5ea; color: #1d1d1f; border: none; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    
    button.main-btn { width: 100%; padding: 14px; background: #0071e3; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button.main-btn:disabled { background: #86868b; cursor: not-allowed; }
    
    .loading { display: none; text-align: center; margin: 20px 0; color: #86868b; line-height: 1.5; }
    
    .result-section { margin-top: 24px; }
    .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; border-bottom: 2px solid #0071e3; padding-bottom: 6px; color: #0071e3; }
    
    .word-card { background: #fbfbfd; border: 1px solid #e5e5ea; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .word-title { font-size: 1.1rem; font-weight: 700; color: #1d1d1f; }
    .word-meaning { font-size: 0.95rem; color: #0071e3; margin: 4px 0 8px 0; font-weight: 600; }
    .word-context { font-size: 0.88rem; color: #6e6e73; background: #f2f2f7; padding: 8px; border-radius: 6px; }
    
    .confusing-card { background: #fff9e6; border: 1px solid #ffe0b2; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .confusing-pair { font-weight: 700; color: #d97706; font-size: 1rem; }
    .confusing-desc { font-size: 0.88rem; color: #4b5563; margin-top: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h1>📖 모의고사 21~41번 AI 단어 분석</h1>
  
  <div class="input-group">
    <label for="apiKey">Gemini API Key (자동 저장됨)</label>
    <div class="key-wrapper">
      <input type="text" id="apiKey" placeholder="Gemini API Key 입력">
      <button class="btn-clear" onclick="clearApiKey()">삭제</button>
    </div>
  </div>

  <div class="input-group">
    <label for="pdfFile">전체 모의고사 PDF 업로드</label>
    <input type="file" id="pdfFile" accept="application/pdf">
  </div>

  <button class="main-btn" id="analyzeBtn" onclick="processPDF()">21~41번 단어 분석 시작</button>

  <div class="loading" id="loadingText">
    ⏳ PDF 전체 텍스트 추출 중...<br>
    (21번~41번 영역 감지 및 문맥/유사어 분석에는 약 10~20초가 소요됩니다)
  </div>

  <div class="result-section" id="resultContainer"></div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  window.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      document.getElementById('apiKey').value = savedKey;
    }
  });

  function clearApiKey() {
    localStorage.removeItem('gemini_api_key');
    document.getElementById('apiKey').value = '';
    alert('저장된 API Key가 삭제되었습니다.');
  }

  async function processPDF() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const fileInput = document.getElementById('pdfFile');
    const loadingText = document.getElementById('loadingText');
    const resultContainer = document.getElementById('resultContainer');

    if (!apiKey) { alert('Gemini API Key를 입력해 주세요.'); return; }
    if (!fileInput.files[0]) { alert('PDF 파일을 선택해 주세요.'); return; }

    localStorage.setItem('gemini_api_key', apiKey);

    loadingText.style.display = 'block';
    resultContainer.innerHTML = '';
    document.getElementById('analyzeBtn').disabled = true;

    try {
      const file = fileInput.files[0];
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        fullText += pageText + '\n';
      }

      if (!fullText.trim()) {
        throw new Error("PDF에서 텍스트를 추출하지 못했습니다. 스캔본이 아닌 원본 PDF 파일인지 확인해 주세요.");
      }

      const data = await analyzeTextWithGemini(fullText, apiKey);
      renderResults(data);
    } catch (error) {
      alert('오류가 발생했습니다: ' + error.message);
    } finally {
      loadingText.style.display = 'none';
      document.getElementById('analyzeBtn').disabled = false;
    }
  }

  async function analyzeTextWithGemini(text, apiKey) {
    const prompt = `
    다음은 영어 모의고사 시험지 전체의 텍스트입니다.
    
    [요청 사항]
    1. 전체 텍스트 중 **21번 문제 영역부터 41번 문제 영역 사이의 지문**만 집중적으로 분석하세요. (1~20번 듣기 및 42번 이후는 제외)
    2. 21~41번 지문에서 고등학생이 문맥을 파악하기 위해 꼭 알아야 하는 핵심/난이도 높은 단어를 추출하고, **사전적 의미가 아닌 해당 지문 문맥에 맞는 정확한 뜻**을 제공하세요.
    3. 분석이 끝난 후, 맨 마지막에는 철자/형태가 비슷해서 헷갈리기 쉬운 단어쌍이나 자주 활용되는 파생어/핵심 어휘 묶음을 별도로 정리해 주세요.

    반드시 응답은 아래 형태의 순수한 JSON 구조로만 출력하세요. 다른 설명이나 마크다운 표현은 절대 포함하지 마세요.

    {
      "contextWords": [
        {
          "word": "단어",
          "meaning": "지문 문맥 맞춤 한국어 뜻",
          "context": "단어가 쓰인 지문의 핵심 맥락 설명 또는 해당 문장"
        }
      ],
      "confusingWords": [
        {
          "pair": "단어A vs 단어B (또는 헷갈리는 어휘군)",
          "description": "두 단어의 구별점 및 각각의 뜻/활용 팁"
        }
      ]
    }

    모의고사 전체 텍스트:
    ${text.substring(0, 50000)}
    `;

    // 최신 표준 모델 엔드포인트 세트
    const apiEndpoints = [
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`
    ];

    let lastError = null;
    let resData = null;

    for (const url of apiEndpoints) {
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        if (response.ok) {
          resData = await response.json();
          break;
        } else {
          const errBody = await response.json();
          lastError = errBody.error?.message || 'API 호출 실패';
        }
      } catch (err) {
        lastError = err.message;
      }
    }

    if (!resData) {
      throw new Error(lastError || 'API 호출에 실패했습니다. API Key 권한이나 키 문자열을 확인해 주세요.');
    }

    let rawText = resData.candidates[0].content.parts[0].text;
    
    rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    return JSON.parse(jsonMatch ? jsonMatch[0] : rawText);
  }

  function renderResults(data) {
    const container = document.getElementById('resultContainer');
    
    let html = '<div class="section-title">📌 21~41번 지문 문맥 맞춤 어휘</div>';
    if (data.contextWords && data.contextWords.length > 0) {
      data.contextWords.forEach(item => {
        html += `
          <div class="word-card">
            <div class="word-title">${item.word}</div>
            <div class="word-meaning">${item.meaning}</div>
            <div class="word-context">💡 문맥: ${item.context}</div>
          </div>
        `;
      });
    }

    html += '<div class="section-title" style="margin-top: 32px; color: #d97706; border-color: #d97706;">⚠️ 혼동하기 쉬운 철자 & 빈출 어휘 묶음</div>';
    if (data.confusingWords && data.confusingWords.length > 0) {
      data.confusingWords.forEach(item => {
        html += `
          <div class="confusing-card">
            <div class="confusing-pair">${item.pair}</div>
            <div class="confusing-desc">${item.description}</div>
          </div>
        `;
      });
    }

    container.innerHTML = html;
  }
</script>

</body>
</html>
